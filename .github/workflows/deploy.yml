# CI (specs + lint + eager-load check) gates the deploy, Ekklesia-style.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC
  contents: read

concurrency: deploy-payforge

env:
  ECR: 606114586218.dkr.ecr.us-east-1.amazonaws.com
  INSTANCE: i-0f862e6a8a78d505a

jobs:
  ci-backend:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true
      - name: Prepare test databases
        run: bin/rails db:prepare
      - name: Eager-load check (catches production boot failures)
        run: bin/rails zeitwerk:check
      - name: RuboCop (blocking — baseline in .rubocop_todo.yml)
        run: bundle exec rubocop --format quiet
      - name: RSpec
        run: bundle exec rspec --format progress

  ci-frontend:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
        continue-on-error: true # informational until purity warnings are cleaned up
      - run: npm run build

  security:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true
      - name: Brakeman (static security analysis)
        run: bin/brakeman --no-pager
        continue-on-error: true # informational until findings are triaged
      - name: bundler-audit (known CVEs) — blocking
        run: bin/bundler-audit
      - name: npm audit (frontend, high+)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

  build-and-deploy:
    needs: [ci-backend, ci-frontend]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Assume AWS deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::606114586218:role/portfolio-github-deploy
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend image
        run: |
          docker build backend \
            -t $ECR/portfolio/payforge-backend:${{ github.sha }} -t $ECR/portfolio/payforge-backend:latest
          docker push $ECR/portfolio/payforge-backend:${{ github.sha }}
          docker push $ECR/portfolio/payforge-backend:latest

      - name: Build & push frontend image (public API URL baked)
        run: |
          docker build frontend \
            --build-arg NEXT_PUBLIC_API_URL=https://payforge-api.sathwiksangeethamproject.dev \
            -t $ECR/portfolio/payforge-frontend:${{ github.sha }} -t $ECR/portfolio/payforge-frontend:latest
          docker push $ECR/portfolio/payforge-frontend:${{ github.sha }}
          docker push $ECR/portfolio/payforge-frontend:latest

      - name: Roll the host (pull + up) via SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE \
            --document-name AWS-RunShellScript \
            --timeout-seconds 600 \
            --parameters 'commands=["set -e; cd /opt/portfolio; aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 606114586218.dkr.ecr.us-east-1.amazonaws.com > /dev/null; docker compose pull -q payforge-backend payforge-frontend; docker compose up -d payforge-backend payforge-sidekiq payforge-frontend; sleep 30; docker compose ps payforge-backend payforge-sidekiq payforge-frontend"]' \
            --query 'Command.CommandId' --output text)
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE --query 'Status' --output text)
            [ "$STATUS" = "Success" ] && break
            [ "$STATUS" = "Failed" ] && { aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE --query 'StandardErrorContent' --output text; exit 1; }
            sleep 10
          done
          aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE --query 'StandardOutputContent' --output text | tail -5

      - name: Verify public endpoints
        run: |
          sleep 10
          curl -sf https://payforge-api.sathwiksangeethamproject.dev/health
          curl -sfL -o /dev/null https://payforge.sathwiksangeethamproject.dev/
          curl -sfL -o /dev/null https://payforge.sathwiksangeethamproject.dev/docs
          echo "payforge healthy"
