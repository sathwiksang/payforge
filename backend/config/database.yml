default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV.fetch("DB_USERNAME") { ENV["USER"] } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "" } %>

development:
  <<: *default
  database: payforge_development

test:
  <<: *default
  database: payforge_test

production:
  primary: &primary_production
    <<: *default
    database: payforge_production
    username: <%= ENV.fetch("DB_USERNAME") { "payforge" } %>
    password: <%= ENV["DB_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: payforge_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: payforge_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: payforge_production_cable
    migrations_paths: db/cable_migrate
